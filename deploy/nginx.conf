##############################################################
# IkelyaneMed — Nginx Virtual Host
# Copier dans : /etc/nginx/sites-available/ikelyanemed
# Puis : ln -s /etc/nginx/sites-available/ikelyanemed /etc/nginx/sites-enabled/
##############################################################

server {
    listen 80;
    server_name 144.91.103.251;
    # server_name ikelyanemed.com www.ikelyanemed.com;  # avec domaine

    root /var/www/ikelyanemed/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/ikelyanemed_access.log;
    error_log  /var/log/nginx/ikelyanemed_error.log;

    # Taille max upload (ordonnances, images)
    client_max_body_size 20M;

    # CodeIgniter : tout passe par index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.1-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Sécurité : bloquer accès aux fichiers sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ ^/(app|system|writable|deploy)/ {
        deny all;
        return 404;
    }

    # Cache statique (assets)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}

